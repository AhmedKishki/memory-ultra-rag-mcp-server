[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-ultra-rag-mcp"
version = "0.8.0"
description = "Serve UltraRAG's memory over stdio MCP: a project's own memory inside the repository, and the shared global memory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ahmed Kishki" }]
keywords = ["mcp", "memory", "ultrarag", "agent-continuity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Legacy settings engine; migration to self-contained code is collection work.
    "config-ultra-rag-mcp @ git+https://github.com/AhmedKishki/config-ultra-rag-mcp.git@cbd47bb46efe85340de34f8f8f13fc6516e7fecb",
    # Local models, on CPU, run in process. The embedder is what makes a lookup
    # work without assuming the caller's wording; numpy arrives with it and is
    # pinned here rather than left to the resolver, because the models run on it
    # whether or not this package imports it — the vector scan is plain arithmetic
    # so that `vectors.py` stays runnable with no model at all.
    "fastembed==0.8.0",
    "fastmcp==3.4.0",
    "numpy>=1.26,<3",
    "platformdirs==4.11.10",
    # Legacy browser infrastructure, pinned until its planned local replacement.
    "ui-ultra-rag-mcp @ git+https://github.com/AhmedKishki/ui-ultra-rag-mcp.git@03647ceb3322d6a7be80edc2413d967f65f9b4a9",
]

[project.scripts]
memory-ultra-rag-mcp = "memory_ultra_rag_mcp.server:main"
memory-ultra-rag-reindex = "memory_ultra_rag_mcp.reindex:main"
memory-ultra-rag-ui = "memory_ultra_rag_mcp.ui:main"

[project.urls]
Repository = "https://github.com/AhmedKishki/memory-ultra-rag-mcp-server"
Issues = "https://github.com/AhmedKishki/memory-ultra-rag-mcp-server/issues"
"Upstream UltraRAG" = "https://github.com/OpenBMB/UltraRAG"
"UltraRAG Documentation" = "https://ultrarag.openbmb.cn/"

[dependency-groups]
dev = [
    "pytest",
    # The same ruff the sibling repositories pin, so the gates are identical.
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The default settings ship with the package: the code has no copy of them, and
# `sources_for` reads this one file from beside `settings.py`. Without this the
# built wheel has no defaults and the server refuses to start.
memory_ultra_rag_mcp = ["default.toml"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: starts the real stdio server in a child process",
    "upstream: compares against a UltraRAG checkout when ULTRARAG_CHECKOUT is set",
]

[tool.ruff]
line-length = 88
target-version = "py311"
