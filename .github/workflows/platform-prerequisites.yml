name: Platform prerequisites

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-fts5:
    name: FTS5 · Linux x64 · Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Verify SQLite FTS5
        run: python scripts/check_sqlite_fts5.py
